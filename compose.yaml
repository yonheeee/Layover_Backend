name: layover

services:
  mysql:
    image: mysql:8.4
    container_name: layover-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: daejeon_layover
      MYSQL_USER: ssafy
      MYSQL_PASSWORD: ssafy
      MYSQL_ROOT_PASSWORD: layover-root-local
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - layover-mysql-data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - layover-network

  backend:
    container_name: layover-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: optional:file:/run/secrets/application-local.properties
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/aws-credentials
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/daejeon_layover?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ssafy
      SPRING_DATASOURCE_PASSWORD: ssafy
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_OPEN_IN_VIEW: "false"
      REDIS_HOST: 127.0.0.1
      EMAIL_VERIFICATION_STORAGE: memory
      PLACE_SYNC_PUBLIC_ENABLED: "false"
      PLACE_SYNC_ON_STARTUP: "true"
      UPLOAD_DIR: /app/uploads
      TZ: Asia/Seoul
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - layover-uploads:/app/uploads
    secrets:
      - source: application-local-properties
        target: application-local.properties
      - source: aws-credentials
        target: aws-credentials
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - layover-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/places || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  layover-mysql-data:
  layover-uploads:

networks:
  layover-network:
    driver: bridge

secrets:
  application-local-properties:
    file: ./src/main/resources/application-local.properties
  aws-credentials:
    file: ${USERPROFILE}/.aws/credentials
