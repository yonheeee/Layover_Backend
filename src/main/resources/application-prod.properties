# Production-only settings. Secrets must be supplied by the deployment platform.

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

storage.type=s3
email.verification.storage=redis
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}

ssafy.jwt.secret-string=${JWT_SECRET_STRING}
chat.crypto.key=${CHAT_CRYPTO_KEY}

place.sync.public-enabled=false
place.sync.on-startup=${PLACE_SYNC_ON_STARTUP:false}
place.sync.scheduler-enabled=false
place.station-seed.enabled=true

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.health.mail.enabled=false

logging.file.name=
logging.level.root=${LOG_LEVEL_ROOT:INFO}
