# =========================================================
# Layover Backend - Common Settings
# ---------------------------------------------------------
# 이 파일은 공통 설정과 기본값만 관리합니다.
# 실제 DB 계정, API 키, 메일 비밀번호 등은 application-local.properties
# 또는 서버 환경변수에 작성하세요.
# =========================================================

spring.application.name=Layover_Backend

# 로컬 개발 기본값은 local입니다.
# 배포 서버에서는 SPRING_PROFILES_ACTIVE=prod 등으로 덮어쓰는 것을 권장합니다.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}


# =========================================================
# Server / Frontend / CORS
# =========================================================

# Cloud Run은 PORT를 주입하고, 로컬/Docker Compose는 SERVER_PORT를 사용합니다.
server.port=${PORT:${SERVER_PORT:8080}}

# 프론트엔드 주소
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# CORS 허용 오리진
# 로컬 개발에서는 localhost, 127.0.0.1, 같은 네트워크 IP 접근을 허용합니다.
# 배포 시에는 실제 프론트 도메인만 허용하는 것을 권장합니다.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://172.*.*.*:*}


# =========================================================
# External HTTP Client (RestTemplate)
# ---------------------------------------------------------
# 코스 1회 생성은 구간마다 카카오 경로 API를 동기 호출하므로
# 외부 API 한 곳만 느려져도 톰캣 스레드가 묶입니다.
# 모든 외부 호출에 타임아웃과 커넥션 풀 상한을 적용합니다.
# =========================================================

http.client.connect-timeout-seconds=${HTTP_CLIENT_CONNECT_TIMEOUT_SECONDS:3}
http.client.read-timeout-seconds=${HTTP_CLIENT_READ_TIMEOUT_SECONDS:5}
http.client.connection-request-timeout-seconds=${HTTP_CLIENT_CONNECTION_REQUEST_TIMEOUT_SECONDS:2}
http.client.max-total=${HTTP_CLIENT_MAX_TOTAL:100}
http.client.max-per-route=${HTTP_CLIENT_MAX_PER_ROUTE:30}


# =========================================================
# Encoding / JSON
# =========================================================

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Vue와 통신할 때 camelCase 유지
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE


# =========================================================
# File Upload / Storage
# =========================================================

upload.dir=${UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}

# storage.type
# - local: 서버 로컬 폴더에 저장
# - s3: AWS S3에 저장
storage.type=${STORAGE_TYPE:local}

aws.s3.region=${AWS_REGION:ap-northeast-2}
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}


# =========================================================
# Database / MyBatis
# ---------------------------------------------------------
# datasource 실제 값은 application-local.properties에 작성합니다.
# =========================================================

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=false


# =========================================================
# Security / JWT / Chat Encryption
# =========================================================

# JWT 설정
# 실제 운영에서는 반드시 긴 랜덤 문자열을 환경변수로 주입하세요.
ssafy.jwt.secret-string=${JWT_SECRET_STRING:}
ssafy.jwt.access-expmin=${JWT_ACCESS_EXPMIN:60}
ssafy.jwt.refresh-expmin=${JWT_REFRESH_EXPMIN:10080}

# 채팅/신고 암호화 키
# 운영에서는 CHAT_CRYPTO_KEY를 AWS Secrets Manager, Parameter Store, KMS,
# 또는 서버 환경변수로 주입하세요.
chat.crypto.key=${CHAT_CRYPTO_KEY:layover-local-dev-chat-crypto-key-change-me}


# =========================================================
# Kakao API
# =========================================================

# 카카오 REST API 키
# 지도, 장소 검색, 길찾기 등 REST API 호출에 사용합니다.
kakao.rest-api-key=${KAKAO_REST_API_KEY:${kakao.api.key:}}

# 기존 코드/설정 호환용 fallback 값
kakao.api.key=${KAKAO_API_KEY:}

# 카카오 로그인용 설정
kakao.client-id=${KAKAO_CLIENT_ID:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/api/login/kakao/callback}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.admin-key=${KAKAO_ADMIN_KEY:}


# =========================================================
# External Mobility / Route APIs
# =========================================================

# 대전 버스 API
daejeon.bus.api.key=${DAEJEON_BUS_API_KEY:}

# TMap 보행/자동차 경로 API
tmap.api.key=${TMAP_API_KEY:}

# 버스정류장 기반 추정 길찾기 기능
# 정확도가 낮아 기본값은 비활성화합니다.
route.bus-stop-estimation.enabled=${ROUTE_BUS_STOP_ESTIMATION_ENABLED:false}


# =========================================================
# TourAPI
# =========================================================

tour.api.key=${TOUR_API_KEY:}

# 로컬에서 DB를 비운 뒤 관광지 데이터를 수동 동기화할 때만 true로 켭니다.
# 배포 환경에서는 false를 유지하세요.
place.sync.public-enabled=${PLACE_SYNC_PUBLIC_ENABLED:false}
place.sync.scheduler-enabled=${PLACE_SYNC_SCHEDULER_ENABLED:true}


# =========================================================
# Weather (기상청 단기예보)
# ---------------------------------------------------------
# 공공데이터포털 "기상청_단기예보 ((구)_동네예보) 조회서비스" 활용신청 후
# 발급받은 일반 인증키(Decoding)를 application-local.properties에 넣으세요.
# 조회에 실패해도 코스 추천은 날씨 조건 없이 그대로 동작합니다.
# =========================================================

weather.enabled=${WEATHER_ENABLED:true}
weather.api.key=${WEATHER_API_KEY:}
weather.api.base-url=${WEATHER_API_BASE_URL:https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}


# =========================================================
# Train API
# ---------------------------------------------------------
# train.api.provider
# - tago: TAGO 열차 API 사용
# - korail-sample: 기존 코레일 샘플 API 사용
# - auto: TAGO 실패 시 기존 방식 fallback
# =========================================================

train.api.provider=${TRAIN_API_PROVIDER:tago}

train.tago.api-key=${TAGO_TRAIN_API_KEY:}
train.tago.base-url=${TAGO_TRAIN_BASE_URL:https://apis.data.go.kr/1613000/TrainInfo/GetStrtpntAlocFndTrainInfo}

# 특정 열차 등급만 조회하고 싶을 때 사용합니다.
# 비워두면 전체 조회합니다.
train.tago.train-grade-code=${TAGO_TRAIN_GRADE_CODE:}


# =========================================================
# AI Course Recommendation
# =========================================================

ai.course.enabled=${AI_COURSE_ENABLED:true}
ai.course.api-key=${AI_COURSE_API_KEY:}
ai.course.base-url=${AI_COURSE_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1/chat/completions}
ai.course.model=${AI_COURSE_MODEL:gpt-4o-mini}

# AI 호출은 응답 생성에 수 초가 걸리므로 일반 외부 API보다 긴 타임아웃을 씁니다.
ai.course.connect-timeout-seconds=${AI_COURSE_CONNECT_TIMEOUT_SECONDS:3}
ai.course.read-timeout-seconds=${AI_COURSE_READ_TIMEOUT_SECONDS:10}

# 회로 차단기
# - max-attempts: 한 요청 안에서의 재시도 횟수 (타임아웃이면 재시도하지 않고 즉시 폴백)
# - failure-threshold: 연속 실패가 이 횟수에 도달하면 AI 호출을 잠시 멈춥니다.
# - circuit-open-seconds: 멈춰 있는 시간. 지나면 자동으로 다시 시도합니다.
# AI가 막혀도 코스 추천은 규칙 기반 폴백으로 계속 동작합니다.
ai.course.max-attempts=${AI_COURSE_MAX_ATTEMPTS:2}
ai.course.failure-threshold=${AI_COURSE_FAILURE_THRESHOLD:2}
ai.course.circuit-open-seconds=${AI_COURSE_CIRCUIT_OPEN_SECONDS:120}


# =========================================================
# Stamp
# ---------------------------------------------------------
# 스탬프는 실제로 그 장소에 갔을 때만 찍혀야 합니다.
# 프론트엔드뿐 아니라 서버에서도 좌표 반경을 확인합니다.
# 배포 환경에서는 enabled=true를 유지하세요.
# =========================================================

stamp.verification.enabled=${STAMP_VERIFICATION_ENABLED:true}
stamp.verification.radius-meters=${STAMP_VERIFICATION_RADIUS_METERS:100}


# =========================================================
# Course
# =========================================================

# 열차 복귀를 위해 남겨두는 여유 시간(분). 코스 편성 시 잔여 시간에서 차감합니다.
course.return-buffer-minutes=${COURSE_RETURN_BUFFER_MINUTES:30}


# =========================================================
# Mail
# ---------------------------------------------------------
# 실제 계정과 앱 비밀번호는 application-local.properties에 작성합니다.
# =========================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =========================================================
# Redis / Email Verification
# ---------------------------------------------------------
# 이메일 인증번호는 DB에 저장하지 않습니다.
# 기본값은 서버 메모리이며, 운영/공유 서버에서는 Redis 사용을 권장합니다.
# 채팅에서도 Redis를 실시간/캐시 보조 용도로 사용합니다.
# =========================================================

email.verification.storage=${EMAIL_VERIFICATION_STORAGE:memory}

spring.data.redis.host=${REDIS_HOST:}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
