spring.datasource.url=jdbc:h2:mem:layover;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

place.station-seed.enabled=false
place.sync.public-enabled=false
place.sync.on-startup=false
storage.type=local
email.verification.storage=memory
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=false

ssafy.jwt.secret-string=test-only-jwt-secret-key-that-is-long-enough-for-hs384-signing-1234567890
chat.crypto.key=test-only-chat-crypto-key-32bytes

weather.enabled=false
ai.course.enabled=false
