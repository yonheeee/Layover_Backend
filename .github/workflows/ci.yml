name: Backend CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Build container
        run: docker build --tag layover-backend:${{ github.sha }} .

  deploy-production:
    if: vars.BACKEND_CD_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: backend-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          service: layover-backend
          source: .
          env_vars: |-
            SPRING_PROFILES_ACTIVE=prod
            SPRING_CONFIG_ADDITIONAL_LOCATION=optional:file:/secrets/application-secrets.properties
            SPRING_DATASOURCE_URL=${{ vars.SPRING_DATASOURCE_URL }}
            SPRING_DATASOURCE_USERNAME=${{ vars.SPRING_DATASOURCE_USERNAME }}
            REDIS_HOST=${{ vars.REDIS_HOST }}
            REDIS_PORT=6379
            REDIS_SSL_ENABLED=true
            STORAGE_TYPE=s3
            AWS_REGION=ap-northeast-2
            AWS_S3_BUCKET=layover-community-image-storage-989142032322-ap-northeast-2-an
            AWS_S3_PUBLIC_BASE_URL=https://layover-community-image-storage-989142032322-ap-northeast-2-an.s3.ap-northeast-2.amazonaws.com
          env_vars_update_strategy: overwrite
          secrets: |-
            /secrets/application-secrets.properties=layover-app-secrets:latest
            AWS_ACCESS_KEY_ID=layover-aws-access-key-id:latest
            AWS_SECRET_ACCESS_KEY=layover-aws-secret-access-key:latest
          secrets_update_strategy: overwrite
          flags: >-
            --allow-unauthenticated
            --memory=1Gi
            --cpu=1
            --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --min-instances=0
            --max-instances=2
            --concurrency=40
            --timeout=300

      - name: Verify health endpoint
        run: curl --fail --retry 10 --retry-delay 5 "${{ steps.deploy.outputs.url }}/actuator/health"
